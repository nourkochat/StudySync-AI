<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Nour Kochat">
    <meta name="description" content="Connectez-vous à votre compte StudySync AI">
    <title>StudySync AI - Connexion</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="page-formulaire">

    <header>
      <nav>
        <div class="logo">
          <span class="logo-icon">⬡</span>
          <strong>StudySync <mark>AI</mark></strong>
        </div>
        <ul>
          <li><a href="index.html">Accueil</a></li>
          <li><a href="inscription.html">Inscription</a></li>
          <li><a href="connexion.html">Connexion</a></li>
          <li><a href="dashboard.html">Dashboard</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="section-formulaire">
        <div class="formulaire-conteneur formulaire-petit">

          <div class="formulaire-entete">
            <div class="icone-connexion">🔐</div>
            <h1>Bon retour !</h1>
            <p>Connectez-vous pour accéder à votre groupe d'étude.</p>
          </div>

          <div class="formulaire-corps">

            <div class="champ-groupe">
              <label for="email-co">Adresse e-mail</label>
              <input type="email" id="email-co" name="email"
                     placeholder="votre@email.com">
            </div>

            <div class="champ-groupe">
              <label for="mdp-co">Mot de passe</label>
              <input type="password" id="mdp-co" name="mot-de-passe"
                     placeholder="Votre mot de passe">
            </div>

            <div class="champ-checkbox-simple">
              <label>
                <input type="checkbox" name="se-souvenir" value="oui">
                <span>Se souvenir de moi</span>
              </label>
            </div>

            <div class="bouton-centrer">
              <button type="button" class="bouton-principal" id="btn-connecter">
                Se connecter &rarr;
              </button>
            </div>

            <hr>

            <p class="lien-inscription">
              Pas encore de compte ?
              <a href="inscription.html">Créer un compte gratuitement</a>
            </p>

          </div>

        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2025 <strong>StudySync AI</strong> &mdash; Projet réalisé par <em>Nour Kochat</em></p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
